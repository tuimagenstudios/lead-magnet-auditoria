<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auditoría digital gratis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --night: #05091a;
      --night-raised: #0a1028;
      --night-soft: #101735;
      --cyan: #00e0ff;
      --cyan-soft: rgba(0, 224, 255, 0.14);
      --text: #f7fbff;
      --text-muted: #a8b3cf;
      --line: rgba(255, 255, 255, 0.12);
      --line-strong: rgba(0, 224, 255, 0.45);
      --error: #ff5c7a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: "Space Grotesk", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% -10%, rgba(0, 224, 255, 0.14), transparent 34rem),
        var(--night);
    }

    main {
      width: min(100%, 1120px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 56px 24px;
      display: grid;
      place-items: center;
    }

    .shell {
      width: min(100%, 620px);
      padding: clamp(28px, 5vw, 48px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(10, 16, 40, 0.92), rgba(5, 9, 26, 0.94));
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 26px;
      padding: 8px 12px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      color: var(--cyan);
      background: var(--cyan-soft);
      font-size: 0.9rem;
      font-weight: 600;
    }

    h1 {
      margin: 0;
      max-width: 11ch;
      font-size: clamp(2.55rem, 8vw, 5.4rem);
      line-height: 0.94;
      font-weight: 700;
    }

    .subtitle {
      margin: 22px 0 34px;
      max-width: 560px;
      color: var(--text-muted);
      font-size: 1.08rem;
      line-height: 1.65;
    }

    form {
      display: grid;
      gap: 18px;
    }

    label {
      display: grid;
      gap: 9px;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 600;
    }

    input {
      width: 100%;
      min-height: 54px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 16px;
      color: var(--text);
      background: var(--night-soft);
      font: inherit;
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    input::placeholder {
      color: rgba(168, 179, 207, 0.58);
    }

    input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 4px rgba(0, 224, 255, 0.12);
      background: #0d1531;
    }

    button {
      min-height: 58px;
      margin-top: 8px;
      border: 0;
      border-radius: 8px;
      color: #001018;
      background: var(--cyan);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 160ms ease, filter 160ms ease, opacity 160ms ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.06);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.62;
    }

    .message {
      min-height: 24px;
      margin: 2px 0 0;
      font-size: 0.98rem;
      font-weight: 600;
    }

    .message.success {
      color: var(--cyan);
    }

    .message.error {
      color: var(--error);
    }

    @media (max-width: 640px) {
      main {
        padding: 28px 16px;
        align-items: start;
      }

      .shell {
        padding: 26px 18px;
      }

      h1 {
        max-width: 12ch;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="shell" aria-labelledby="titulo">
      <div class="badge">✦ Gratis · Sin compromiso</div>
      <h1 id="titulo">Descubrí qué le falta a tu presencia digital</h1>
      <p class="subtitle">Analizamos tu web, tus canales y las señales clave de confianza para detectar oportunidades concretas de mejora.</p>

      <form id="audit-form" novalidate>
        <label for="url">
          URL del sitio web
          <input id="url" name="url" type="url" placeholder="https://tumarca.com" required>
        </label>

        <label for="instagram">
          @Instagram
          <input id="instagram" name="instagram" type="text" placeholder="@tumarca">
        </label>

        <label for="email">
          Email
          <input id="email" name="email" type="email" placeholder="hola@tumarca.com" required>
        </label>

        <button id="submit-button" type="submit">Quiero mi auditoría gratis →</button>
        <p id="message" class="message" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script>
    const form = document.querySelector("#audit-form");
    const button = document.querySelector("#submit-button");
    const message = document.querySelector("#message");

    const setMessage = (text, type) => {
      message.textContent = text;
      message.className = `message ${type || ""}`.trim();
    };

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      setMessage("", "");

      const data = {
        url: form.url.value.trim(),
        instagram: form.instagram.value.trim(),
        email: form.email.value.trim()
      };

      if (!data.url || !data.email || !form.email.validity.valid) {
        setMessage("Revisá la URL y el email antes de enviar.", "error");
        return;
      }

      button.disabled = true;
      button.textContent = "Enviando...";

      try {
        const response = await fetch("/auditar", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });

        if (!response.ok) {
          throw new Error("La petición falló");
        }

        setMessage("¡Listo! En minutos recibirás tu diagnóstico.", "success");
        form.reset();
      } catch (error) {
        setMessage("No pudimos enviar la solicitud. Intentá nuevamente.", "error");
      } finally {
        button.disabled = false;
        button.textContent = "Quiero mi auditoría gratis →";
      }
    });
  </script>
</body>
</html>
